name: TTS test Parler (no upload)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  parler:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        timeout-minutes: 15
        run: |
          pip install --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -1
          pip install --break-system-packages soundfile git+https://github.com/huggingface/parler-tts.git transformers 2>&1 | tail -2
          TV=$(python3 -c "import torch;print(torch.__version__.split('+')[0])")
          pip install --break-system-packages --no-deps --force-reinstall torchaudio==$TV --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -2
      - name: Generate samples
        timeout-minutes: 20
        continue-on-error: true
        run: |
          mkdir -p out
          python3 tools/parler_test.py > out/log.txt 2>&1 || true
          pip list 2>/dev/null | grep -i -E 'torch|transformers|parler|soundfile' >> out/log.txt
          ls -la out
      - name: Publish samples
        if: always()
        run: |
          mkdir -p /tmp/r && cd /tmp/r && git init -q && git config user.name bot && git config user.email bot@users.noreply.github.com
          git switch --orphan tts-parler -q; cp -r $GITHUB_WORKSPACE/out/* . 2>/dev/null || true
          git add -A && git commit -qm samples --allow-empty && git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" && git push -q -f origin tts-parler
